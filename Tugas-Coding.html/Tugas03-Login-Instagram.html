<!DOCTYPE html>
<html>
<head>
    <title>Log into Instagram - Tugas 3 HTML</title>
</head>
<body bgcolor="#0b0f19" text="#ffffff" style="margin: 0; padding: 0;">

    <!-- Tabel Utama Full Screen Pembagi Dua Sisi -->
    <table width="100%" border="0" cellpadding="0" cellspacing="0" style="height: 100vh; border-collapse: collapse;">
        <tr valign="middle">
            
            <!-- 1. KOLOM KIRI: BRANDING & ILUSTRASI (Warna Latar #0b0f19) -->
            <td width="50%" align="center" bgcolor="#0b0f19" style="padding: 40px;">
                <table border="0" cellpadding="0" cellspacing="0" width="85%">
                    <!-- Logo Instagram Atas -->
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <img src="https://static.cdninstagram.com/rsrc.php/yO/r/Ny6hrBVLYjl.webp" alt="Instagram Logo" width="60">
                        </td>
                    </tr>
                    <!-- Judul Utama Teks -->
                    <tr>
                        <td align="center" style="padding-bottom: 40px;">
                            <h1 style="margin: 0; font-weight: 500; font-size: 32px; line-height: 1.4;">
                                <font face="sans-serif" color="#ffffff">
                                    See everyday moments from your <br>
                                    <!-- Warna Pink/Magenta Gradasi untuk kata close friends -->
                                    <font color="#ff2d55">close friends</font>.
                                </font>
                            </h1>
                        </td>
                    </tr>
                    <!-- Ilustrasi Gambar Kolase Tengah -->
                    <tr>
                        <td align="center">
                            <img src="https://static.cdninstagram.com/rsrc.php/yJ/r/53X3pk-t2Gn.webp" alt="Close Friends Showcase" width="240">
                        </td>
                    </tr>
                </table>
            </td>

            <!-- 2. KOLOM KANAN: FORMULIR LOGIN (Warna Latar Lebih Gelap #121212) -->
            <td width="50%" align="center" bgcolor="#121212" style="padding: 40px; border-left: 1px solid #262626;">
                <table border="0" cellpadding="0" cellspacing="0" width="360">
                    <!-- Judul Judul Sub Form -->
                    <tr>
                        <td align="left" style="padding-bottom: 25px;">
                            <h2 style="margin: 0; font-weight: 500; font-size: 20px;">
                                <font face="sans-serif" color="#ffffff">Log into Instagram</font>
                            </h2>
                        </td>
                    </tr>
                    
                    <!-- Area Form Input & Tombol Aksi -->
                    <tr>
                        <td>
                            <form action="#" method="post" style="margin: 0;">
                                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                    
                                    <!-- Input 1: Username / Email -->
                                    <tr>
                                        <td style="padding-bottom: 15px;">
                                            <input type="text" name="username" placeholder="Mobile number, username or email" style="width: 100%; box-sizing: border-box; padding: 16px 12px; background-color: #1c1c1e; border: 1px solid #262626; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none;">
                                        </td>
                                    </tr>
                                    
                                    <!-- Input 2: Kata Sandi -->
                                    <tr>
                                        <td style="padding-bottom: 15px;">
                                            <input type="password" name="password" placeholder="Password" style="width: 100%; box-sizing: border-box; padding: 16px 12px; background-color: #1c1c1e; border: 1px solid #262626; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none;">
                                        </td>
                                    </tr>
                                    
                                    <!-- Tombol 3: Log In Utama (Biru Redup Sesuai Gambar) -->
                                    <tr>
                                        <td align="center" bgcolor="#11315c" style="border-radius: 8px; padding: 14px;">
                                            <a href="#" style="text-decoration: none; display: block; width: 100%;">
                                                <font face="sans-serif" color="#ffffff" size="3"><b>Log in</b></font>
                                            </a>
                                        </td>
                                    </tr>

                                    <!-- Tautan 4: Lupa Sandi -->
                                    <tr>
                                        <td align="center" style="padding-top: 25px; padding-bottom: 35px;">
                                            <a href="#" style="text-decoration: none;">
                                                <font face="sans-serif" color="#ffffff" size="3">Forgot password?</font>
                                            </a>
                                        </td>
                                    </tr>

                                    <!-- Tombol 5: Log in dengan Facebook (Abu-abu Gelap Minimalis) -->
                                    <tr>
                                        <td align="center" bgcolor="#1c1c1e" style="border-radius: 8px; padding: 14px;">
                                            <a href="#" style="text-decoration: none; display: block; width: 100%;">
                                                <font face="sans-serif" color="#ffffff" size="3">
                                                    <!-- Gunakan icon bola dunia mini pengganti logo facebook bawaan teks -->
                                                    <b>🌐 Log in with Facebook</b>
                                                </font>
                                            </a>
                                        </td>
                                    </tr>

                                    <!-- Jarak Pemisah Sedikit Antar Tombol Bawah -->
                                    <tr><td height="12"></td></tr>

                                    <!-- Tombol 6: Create New Account (Kotak Transparan Dengan Outline Biru Muda) -->
                                    <tr>
                                        <td align="center">
                                            <table border="1" borderColor="#00a2ed" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse; border-radius: 8px;">
                                                <tr>
                                                    <td align="center" bgcolor="#121212" style="border-radius: 8px; padding: 14px;">
                                                        <a href="#" style="text-decoration: none; display: block; width: 100%;">
                                                            <font face="sans-serif" color="#00a2ed" size="3"><b>Create new account</b></font>
                                                        </a>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>

                                    <!-- Logo Hak Cipta Perusahaan Induk Meta -->
                                    <tr>
                                        <td align="center" style="padding-top: 50px;">
                                            <font face="sans-serif" color="#8e8e93" size="2"><b>&infin; Meta</b></font>
                                        </td>
                                    </tr>

                                </table>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>

        </tr>
    </table>
